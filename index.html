<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#23281F">
<title>Ledger — Money Ops</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDEAE0;
    --paper-alt: #E3DFD1;
    --card: #F5F3EB;
    --ink: #23281F;
    --ink-soft: #6B7063;
    --rule: #C7BFA8;
    --rule-soft: #DAD3BE;
    --brass: #A9835B;
    --brass-deep: #8A6743;
    --moss: #4C6B4F;
    --moss-deep: #3B5A3E;
    --amber: #A9762F;
    --brick: #9C3D2E;
    --slate: #4A5B6B;
    --slate-deep: #38454F;
    --rust: #9B5B45;
    --rust-deep: #7A4635;
    --bezel: #23281F;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: #D9D3BE;
    color: var(--ink);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:430px;
    background: var(--paper);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    position:relative;
  }
  @media (min-width: 480px){
    body{ padding: 30px 0; }
    .phone{
      min-height: 812px;
      max-height: 890px;
      border-radius: 34px;
      overflow:hidden;
      box-shadow: 0 30px 60px -20px rgba(35,40,31,0.4), 0 0 0 9px var(--bezel), 0 0 0 10px #384033;
    }
  }

  .topbar{
    flex-shrink:0;
    padding: 16px 18px 12px;
    border-bottom: 2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    background: var(--paper);
    z-index: 5;
  }
  .topbar h1{
    font-family:'Fraunces', Georgia, serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0;
  }
  .month-nav{ display:flex; align-items:center; gap:8px; font-family:'Fraunces', Georgia, serif; font-size:13.5px; }
  .month-nav button{
    background:none; border:1px solid var(--rule); color:var(--ink);
    width:24px; height:24px; border-radius:50%; font-size:14px; cursor:pointer; line-height:1; font-family:inherit;
  }
  .month-nav button:active{ background: var(--paper-alt); }

  .screen{ flex:1; overflow-y:auto; padding: 16px 18px 100px; -webkit-overflow-scrolling:touch; display:none; }
  .screen.active{ display:block; }

  .bottomnav{
    flex-shrink:0;
    position:absolute; left:0; right:0; bottom:0;
    display:flex;
    background: var(--paper);
    border-top: 1px solid var(--rule);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index: 6;
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color: var(--ink-soft); cursor:pointer; padding:4px 0; font-family:'Inter',sans-serif;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn span{ font-size:10.5px; font-weight:500; }
  .nav-btn.active{ color: var(--brass-deep); }

  section.block{ margin-bottom: 26px; }
  .section-title{
    font-family:'Fraunces', Georgia, serif; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    border-bottom:1px solid var(--rule); padding-bottom:6px; margin-bottom:14px;
  }

  /* ---- Add tab ---- */
  .type-toggle{ display:flex; background:var(--paper-alt); border-radius:10px; padding:3px; margin-bottom:20px; }
  .type-toggle button{
    flex:1; padding:9px 0; border:none; background:none; border-radius:8px; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; font-family:'Inter',sans-serif;
  }
  .type-toggle button.active.expense{ background: var(--ink); color:#F5F3EB; }
  .type-toggle button.active.income{ background: var(--moss); color:#F5F3EB; }

  .amount-wrap{ text-align:center; margin-bottom: 22px; }
  .amount-wrap .cur{ font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--ink-soft); vertical-align:6px; }
  .amount-wrap input{
    border:none; background:none; font-family:'IBM Plex Mono',monospace; font-size:44px; font-weight:500;
    width:70%; text-align:center; color:var(--ink); font-variant-numeric: tabular-nums;
  }
  .amount-wrap input:focus{ outline:none; }
  .amount-underline{ height:2px; background:var(--rule); width:60%; margin:2px auto 0; border-radius:1px; }

  .field-row{ margin-bottom:16px; }
  .field-row label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; }
  .field-row input[type=date], .field-row input[type=text]{
    width:100%; border:none; border-bottom:1.5px solid var(--rule); background:transparent;
    padding:8px 2px; font-size:14.5px; font-family:'Inter',sans-serif; color:var(--ink);
  }
  .field-row input:focus{ outline:none; border-bottom-color: var(--brass-deep); }

  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; padding:8px 14px; border-radius:16px; border:1.5px solid var(--rule); background:var(--card);
    font-size:13px; color:var(--ink); cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif;
  }
  .chip.selected.expense{ background:var(--ink); border-color:var(--ink); color:#F5F3EB; }
  .chip.selected.income{ background:var(--moss); border-color:var(--moss); color:#F5F3EB; }
  .add-chip{ color:var(--brass-deep); border-style:dashed; background:none; }

  .submit-btn{
    width:100%; border:none; padding:14px 0; border-radius:10px; font-size:15px; font-weight:600;
    color:#F5F3EB; cursor:pointer; margin-top:22px; font-family:'Inter',sans-serif;
  }
  .submit-btn.expense{ background: var(--ink); }
  .submit-btn.income{ background: var(--moss); }

  .toast{
    position:absolute; left:18px; right:18px; bottom:80px; background:var(--ink); color:#F5F3EB;
    padding:10px 14px; border-radius:8px; font-size:13px; text-align:center; opacity:0; pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease; transform: translateY(6px); z-index:7;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  /* ---- Overview tab ---- */
  .stat-cards{ display:flex; gap:8px; margin-bottom:24px; }
  .stat-card{ flex:1; background:var(--card); border-radius:10px; padding:12px 10px; }
  .stat-card .label{ font-size:10.5px; color:var(--ink-soft); margin-bottom:4px; }
  .stat-card .value{ font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat-card.income .value{ color:var(--moss-deep); }
  .stat-card.expense .value{ color:var(--brick); }
  .stat-card.net .value.pos{ color:var(--moss-deep); }
  .stat-card.net .value.neg{ color:var(--brick); }

  .donut-wrap{ display:flex; align-items:center; gap:16px; margin-bottom:8px; }
  .donut-svg-wrap{ position:relative; width:120px; height:120px; flex-shrink:0; }
  .donut-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .donut-center .amt{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; }
  .donut-center .lbl{ font-size:9px; color:var(--ink-soft); }
  .legend{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legend-item .amt{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); }
  .empty-note{ font-size:12.5px; color:var(--ink-soft); font-style:italic; font-family:'Fraunces',Georgia,serif; }

  .cat-row{ display:grid; grid-template-columns: 100px 1fr 128px; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--rule-soft); }
  .cat-row:last-of-type{ border-bottom:none; }
  .cat-name{ font-size:13px; }
  .bar-track{ height:7px; background:var(--paper-alt); border-radius:2px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:2px; transition:width 0.4s ease; }
  .cat-figures{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-align:right; color:var(--ink-soft); display:flex; align-items:center; justify-content:flex-end; gap:3px; white-space:nowrap; }
  .cat-figures .spent{ color:var(--ink); }
  .budget-input{ width:52px; border:none; border-bottom:1px dotted var(--rule); background:transparent; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); text-align:right; padding:1px 2px; }
  .budget-input:focus{ outline:none; border-bottom-color:var(--brass-deep); color:var(--ink); }

  /* ---- History tab ---- */
  .filter-chips{ display:flex; gap:8px; margin-bottom:16px; }
  .filter-chips button{ padding:6px 13px; border-radius:14px; border:1.5px solid var(--rule); background:var(--card); font-size:12.5px; color:var(--ink-soft); cursor:pointer; font-family:'Inter',sans-serif; }
  .filter-chips button.active{ background:var(--ink); border-color:var(--ink); color:#F5F3EB; }
  .tx-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--rule-soft); }
  .tx-row .tx-date{ font-size:11px; color:var(--ink-soft); width:42px; flex-shrink:0; padding-top:2px; }
  .tx-row .tx-main{ flex:1; min-width:0; }
  .tx-row .tx-cat{ font-size:13.5px; font-weight:500; }
  .tx-row .tx-note{ font-size:12px; color:var(--ink-soft); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-row .tx-amt{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-variant-numeric:tabular-nums; flex-shrink:0; padding-top:2px; }
  .tx-row .tx-amt.income{ color:var(--moss-deep); }
  .tx-row .tx-amt.expense{ color:var(--ink); }
  .tx-row .del-btn{ background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; padding:2px 4px 2px 8px; flex-shrink:0; }
  .tx-row .del-btn:active{ color:var(--brick); }
  .empty-state{ text-align:center; color:var(--ink-soft); font-style:italic; font-family:'Fraunces',Georgia,serif; padding:30px 0; font-size:13.5px; }

  /* ---- Reports tab ---- */
  .report-card{ background:var(--card); border-radius:12px; padding:16px; margin-bottom:22px; }
  .report-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dotted var(--rule); font-size:13.5px; }
  .report-row:last-child{ border-bottom:none; }
  .report-row .val{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .report-row .val.pos{ color:var(--moss-deep); }
  .report-row .val.neg{ color:var(--brick); }
  .report-row.total{ font-weight:600; padding-top:10px; margin-top:2px; border-top:1.5px solid var(--ink); border-bottom:none; }

  .trend-legend{ display:flex; gap:16px; margin-bottom:10px; font-size:11.5px; color:var(--ink-soft); }
  .trend-legend span{ display:flex; align-items:center; gap:5px; }
  .trend-legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  .top-cats{ list-style:none; margin:0; padding:0; }
  .top-cats li{ display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px dotted var(--rule-soft); }
  .top-cats li:last-child{ border-bottom:none; }
  .top-cats .amt{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); }

  .insights{ background:var(--paper-alt); border-left:3px solid var(--brass); padding:12px 16px; border-radius:0 3px 3px 0; }
  .insight-item{ display:flex; gap:9px; font-size:13px; padding:6px 0; border-bottom:1px dotted var(--rule); }
  .insight-item:last-child{ border-bottom:none; }
  .insight-item .mark{ flex-shrink:0; font-size:12px; margin-top:2px; }
  .insight-item.alert .mark{ color:var(--brick); }
  .insight-item.warn .mark{ color:var(--amber); }
  .insight-item.note .mark{ color:var(--ink-soft); }
  .insight-item.good .mark{ color:var(--moss); }

  .print-btn{
    width:100%; padding:11px 0; border-radius:8px; border:1.5px solid var(--ink); background:none; color:var(--ink);
    font-size:13px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; margin-top:4px;
  }

  .add-cat-inline{ display:flex; gap:8px; margin-top:8px; }
  .add-cat-inline input{ flex:1; border:none; border-bottom:1px solid var(--rule); background:transparent; padding:6px 2px; font-size:13px; font-family:inherit; }
  .add-cat-inline button{ background:none; border:none; color:var(--brass-deep); font-size:13px; cursor:pointer; }

  .type-toggle button.active.lent{ background: var(--slate); color:#F5F3EB; }
  .type-toggle button.active.borrowed{ background: var(--rust); color:#F5F3EB; }

  /* ---- Lend/Borrow tab ---- */
  .stat-card.lend .value{ color:var(--slate-deep); }
  .stat-card.lend.borrow .value{ color:var(--rust-deep); }
  .new-loan-toggle{
    width:100%; padding:11px 0; border-radius:10px; border:1.5px dashed var(--slate); background:none;
    color:var(--slate-deep); font-size:13.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; margin-bottom:18px;
  }
  .new-loan-toggle.is-borrow{ border-color:var(--rust); color:var(--rust-deep); }
  .new-loan-form{ background:var(--card); border-radius:12px; padding:14px; margin-bottom:18px; display:none; }
  .new-loan-form.open{ display:block; }
  .new-loan-form .field-row{ margin-bottom:12px; }
  .new-loan-form .field-row:last-of-type{ margin-bottom:0; }
  .new-loan-form input{
    width:100%; border:none; border-bottom:1.5px solid var(--rule); background:transparent;
    padding:7px 2px; font-size:14px; font-family:'Inter',sans-serif; color:var(--ink);
  }
  .new-loan-form input:focus{ outline:none; border-bottom-color:var(--slate); }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); cursor:pointer; }
  .checkbox-row input{ width:auto; }
  .new-loan-form select{
    width:100%; border:none; border-bottom:1.5px solid var(--rule); background:transparent;
    padding:7px 2px; font-size:14px; font-family:'Inter',sans-serif; color:var(--ink);
  }
  .submit-btn.lend{ background:var(--slate); }
  .submit-btn.lend.borrowed{ background:var(--rust); }
  .chip.kind-chip.selected{ background:var(--ink); border-color:var(--ink); color:#F5F3EB; }

  .person-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--card); border-radius:10px; margin-bottom:8px; cursor:pointer; border:1.5px solid transparent; }
  .person-row.active-filter{ border-color:var(--slate); }
  .person-row .name{ font-size:13.5px; font-weight:600; }
  .person-row .sub{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .person-row .amt{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; }
  .clear-filter{ display:block; font-size:11.5px; color:var(--brass-deep); background:none; border:none; cursor:pointer; margin-bottom:10px; padding:0; }

  .loan-clearby{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; }
  .kind-tag{ display:inline-block; font-size:9.5px; font-weight:600; padding:2px 6px; border-radius:8px; background:var(--paper-alt); color:var(--ink-soft); margin-left:6px; vertical-align:middle; }

  .inst-list{ margin-bottom:10px; }
  .inst-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px dotted var(--rule); gap:8px; }
  .inst-row:last-child{ border-bottom:none; }
  .inst-title{ font-size:12.5px; font-weight:600; }
  .inst-sub{ font-size:11px; color:var(--ink-soft); }
  .inst-badge{ font-size:10px; font-weight:600; padding:3px 8px; border-radius:10px; white-space:nowrap; }
  .inst-badge.paid{ background:rgba(76,107,79,0.15); color:var(--moss-deep); }
  .inst-badge.overdue{ background:rgba(156,61,46,0.15); color:var(--brick); }
  .inst-badge.upcoming{ background:var(--paper-alt); color:var(--ink-soft); }
  .inst-pay-btn{ background:var(--moss); color:#F5F3EB; border:none; border-radius:6px; padding:5px 10px; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif; }

  .activity-row{ display:flex; gap:10px; padding:7px 0; border-bottom:1px dotted var(--rule-soft); font-size:12.5px; }
  .activity-row:last-child{ border-bottom:none; }
  .activity-date{ color:var(--ink-soft); width:38px; flex-shrink:0; font-size:11px; padding-top:1px; }
  .activity-text.repay{ color:var(--moss-deep); }
  .activity-text.closed{ color:var(--moss-deep); font-weight:600; }
  .activity-text.deleted{ color:var(--ink-soft); text-decoration:line-through; }

  .loan-card{ background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; }
  .loan-card.settled{ opacity:0.6; }
  .loan-top{ display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer; }
  .loan-person{ font-size:14.5px; font-weight:600; }
  .loan-date{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .loan-outstanding{ text-align:right; }
  .loan-outstanding .amt{ font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; color:var(--slate-deep); }
  .loan-card.borrowed .loan-outstanding .amt{ color:var(--rust-deep); }
  .loan-outstanding .lbl{ font-size:10px; color:var(--ink-soft); }
  .settled-tag{ font-size:10px; color:var(--moss-deep); font-weight:600; }
  .loan-bar{ height:6px; background:var(--paper-alt); border-radius:2px; overflow:hidden; margin-top:10px; }
  .loan-bar-fill{ height:100%; background:var(--moss); border-radius:2px; transition:width 0.4s ease; }
  .loan-detail{ display:none; margin-top:14px; padding-top:12px; border-top:1px dotted var(--rule); }
  .loan-detail.open{ display:block; }
  .repay-row{ display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:12.5px; }
  .repay-row .amt{ font-family:'IBM Plex Mono',monospace; color:var(--moss-deep); }
  .repay-row .del-btn{ background:none; border:none; color:var(--ink-soft); font-size:11px; cursor:pointer; padding:2px 4px; }
  .repay-form{ display:flex; gap:8px; margin-top:10px; align-items:flex-end; }
  .repay-form input[type=number]{ width:70px; }
  .repay-form input[type=date]{ flex:1; }
  .repay-form input{ border:none; border-bottom:1.5px solid var(--rule); background:transparent; padding:6px 2px; font-size:13px; font-family:'Inter',sans-serif; color:var(--ink); }
  .repay-form input:focus{ outline:none; border-bottom-color:var(--moss); }
  .repay-form button{ background:var(--moss); color:#F5F3EB; border:none; border-radius:6px; padding:7px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; }
  .loan-delete-btn{ background:none; border:none; color:var(--brick); font-size:11.5px; cursor:pointer; margin-top:10px; font-family:'Inter',sans-serif; padding:0; }

  @media print{
    body{ background:#fff; padding:0; }
    .phone{ box-shadow:none; max-width:100%; max-height:none; border-radius:0; }
    .topbar, .bottomnav, #tab-add, #tab-overview, #tab-lend, #tab-history{ display:none !important; }
    .screen{ overflow:visible; padding:20px; }
    .print-btn{ display:none; }
  }
</style>
</head>
<body>
<div class="phone">

  <div class="topbar">
    <h1>Ledger</h1>
    <div class="month-nav" id="monthNavEl">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <span id="monthLabel">—</span>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
  </div>

  <!-- ADD TAB -->
  <div class="screen active" id="tab-add">
    <div class="type-toggle">
      <button type="button" class="expense active" id="toggleExpense">Expense</button>
      <button type="button" class="income" id="toggleIncome">Income</button>
    </div>

    <form id="entryForm">
      <div class="amount-wrap">
        <span class="cur">₹</span><input type="number" id="fAmount" min="0" step="0.01" placeholder="0" inputmode="decimal" required>
        <div class="amount-underline"></div>
      </div>

      <div class="field-row">
        <label>Category</label>
        <div class="chip-row" id="chipRow"></div>
        <div class="add-cat-inline" id="addCatInline" style="display:none;">
          <input type="text" id="newCatInput" placeholder="New category" maxlength="24">
          <button type="button" id="confirmAddCat">Add</button>
        </div>
      </div>

      <div class="field-row">
        <label for="fDate">Date</label>
        <input type="date" id="fDate" required>
      </div>

      <div class="field-row">
        <label for="fNote">Note (optional)</label>
        <input type="text" id="fNote" placeholder="What was it for?" maxlength="60">
      </div>

      <button type="submit" class="submit-btn expense" id="submitBtn">Add expense</button>
    </form>
  </div>

  <!-- OVERVIEW TAB -->
  <div class="screen" id="tab-overview">
    <div class="stat-cards">
      <div class="stat-card income"><div class="label">Income</div><div class="value" id="statIncome">₹0</div></div>
      <div class="stat-card expense"><div class="label">Expense</div><div class="value" id="statExpense">₹0</div></div>
      <div class="stat-card net"><div class="label">Net</div><div class="value" id="statNet">₹0</div></div>
    </div>

    <section class="block">
      <div class="section-title">Where it went</div>
      <div class="donut-wrap" id="donutWrap"></div>
    </section>

    <section class="block">
      <div class="section-title">Category budgets</div>
      <div id="catBreakdown"></div>
    </section>
  </div>

  <!-- LEND/BORROW TAB -->
  <div class="screen" id="tab-lend">
    <div class="type-toggle" id="creditToggle">
      <button type="button" class="lent active" data-dir="lent">Lent</button>
      <button type="button" class="borrowed" data-dir="borrowed">Borrowed</button>
    </div>

    <div class="stat-cards">
      <div class="stat-card lend"><div class="label" id="creditStat1Label">Owed to you</div><div class="value" id="statLendOut">₹0</div></div>
      <div class="stat-card lend"><div class="label" id="creditStat2Label">Repaid</div><div class="value" id="statLendRepaid">₹0</div></div>
    </div>

    <button type="button" class="new-loan-toggle" id="newLoanToggle">+ New entry</button>
    <div class="new-loan-form" id="newLoanForm">
      <div class="field-row" id="kindFieldRow" style="display:none;">
        <label>Type</label>
        <div class="chip-row" id="kindChipRow">
          <button type="button" class="chip kind-chip selected" data-kind="person">Person</button>
          <button type="button" class="chip kind-chip" data-kind="loan">Bank loan / EMI</button>
          <button type="button" class="chip kind-chip" data-kind="chit">Chit fund</button>
        </div>
      </div>
      <div class="field-row">
        <label id="personFieldLabel">Person</label>
        <input type="text" id="loanPerson" list="personList" placeholder="Who's it for?" maxlength="40">
        <datalist id="personList"></datalist>
      </div>
      <div class="field-row">
        <label>Amount ₹</label>
        <input type="number" id="loanAmount" min="0" step="0.01" placeholder="0" inputmode="decimal">
      </div>
      <div class="field-row">
        <label>Date</label>
        <input type="date" id="loanDate">
      </div>
      <div class="field-row">
        <label>Note (optional)</label>
        <input type="text" id="loanNote" placeholder="What's it for?" maxlength="60">
      </div>
      <div class="field-row">
        <label class="checkbox-row"><input type="checkbox" id="loanInstallToggle"> Split into installments</label>
      </div>
      <div class="installment-fields" id="installmentFields" style="display:none;">
        <div class="field-row">
          <label>Number of installments</label>
          <input type="number" id="loanInstallCount" min="2" max="60" value="3">
        </div>
        <div class="field-row">
          <label>Frequency</label>
          <select id="loanInstallFreq">
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>
      </div>
      <button type="button" class="submit-btn lend" id="submitLoan">Add loan</button>
    </div>

    <section class="block" id="personSummaryBlock" style="display:none;">
      <div class="section-title">By person</div>
      <div id="personSummary"></div>
    </section>

    <div id="loansList"></div>

    <section class="block">
      <div class="section-title">History</div>
      <div id="loanActivity"></div>
    </section>
  </div>

  <!-- HISTORY TAB -->
  <div class="screen" id="tab-history">
    <div class="filter-chips">
      <button type="button" class="active" data-filter="all">All</button>
      <button type="button" data-filter="expense">Expenses</button>
      <button type="button" data-filter="income">Income</button>
    </div>
    <div id="txList"></div>
  </div>

  <!-- REPORTS TAB -->
  <div class="screen" id="tab-reports">
    <div class="section-title">Monthly summary</div>
    <div class="report-card" id="summaryCard"></div>

    <section class="block">
      <div class="section-title">6-month trend</div>
      <div class="trend-legend">
        <span><i style="background:var(--moss)"></i>Income</span>
        <span><i style="background:var(--brick)"></i>Expense</span>
      </div>
      <div id="trendChart"></div>
    </section>

    <section class="block">
      <div class="section-title">Top spending categories</div>
      <ul class="top-cats" id="topCats"></ul>
    </section>

    <section class="block">
      <div class="section-title">Required improvements</div>
      <div class="insights" id="insightsBox"></div>
    </section>

    <button type="button" class="print-btn" id="printBtn">Print report</button>
  </div>

  <div class="bottomnav">
    <button class="nav-btn active" data-tab="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Add</span>
    </button>
    <button class="nav-btn" data-tab="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Overview</span>
    </button>
    <button class="nav-btn" data-tab="lend">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <span>Credit</span>
    </button>
    <button class="nav-btn" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
      <span>History</span>
    </button>
    <button class="nav-btn" data-tab="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="19" y1="20" x2="19" y2="14"/></svg>
      <span>Reports</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'expense-ledger-data';
  const PALETTE = ['#A9835B','#4C6B4F','#9C3D2E','#A9762F','#4A5B6B','#6B4C5B','#6B6B3F','#8A5A45','#3F6B66','#7A6A8A','#5B7B95','#8A4A6B'];
  const DEFAULT_EXPENSE_CATS = ["Food","Transport","Utilities","Rent/EMI","Shopping","Health","Entertainment","Savings/Investment","Business","Other"];
  const DEFAULT_INCOME_CATS = ["Business Income","Salary/Drawings","Investment Returns","Rental Income","Freelance","Other Income"];

  let data = { expenseCategories: [...DEFAULT_EXPENSE_CATS], incomeCategories: [...DEFAULT_INCOME_CATS], budgets: {}, entries: [], loans: [], loanLog: [] };
  let currentMonth = new Date(); currentMonth.setDate(1);
  let currentType = 'expense';
  let selectedCategory = null;
  let historyFilter = 'all';
  let newRowId = null;
  let expandedLoanId = null;
  let creditDirection = 'lent';
  let selectedKind = 'person';
  let personFilter = null;

  function fmt(n){
    n = Math.round(n*100)/100;
    return '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:2});
  }
  function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function monthLabel(d){ return d.toLocaleDateString('en-IN',{month:'long',year:'numeric'}); }
  function shortMonthLabel(d){ return d.toLocaleDateString('en-IN',{month:'short'}); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function catColor(list, cat){ const i = list.indexOf(cat); return PALETTE[i % PALETTE.length] || 'var(--ink-soft)'; }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=> t.classList.remove('show'), 1600);
  }

  async function loadData(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const p = JSON.parse(res.value);
        if(p.entries){
          data.expenseCategories = (p.expenseCategories && p.expenseCategories.length) ? p.expenseCategories : DEFAULT_EXPENSE_CATS;
          data.incomeCategories = (p.incomeCategories && p.incomeCategories.length) ? p.incomeCategories : DEFAULT_INCOME_CATS;
          data.budgets = p.budgets || {};
          data.entries = p.entries || [];
          data.loans = (p.loans || []).map(l => ({ direction:'lent', kind:'person', settledLogged:false, ...l }));
          data.loanLog = p.loanLog || [];
        } else if(p.expenses){
          // migrate old expense-only shape
          data.expenseCategories = (p.categories && p.categories.length) ? p.categories : DEFAULT_EXPENSE_CATS;
          data.budgets = p.budgets || {};
          data.entries = p.expenses.map(x => ({ id:x.id, type:'expense', date:x.date, category:x.category, amount:x.amount, note:x.note }));
        }
      }
    }catch(e){ /* first run, defaults stand */ }
  }
  async function saveData(){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(data), false); }
    catch(e){ console.error('save failed', e); }
  }

  function entriesForMonth(key, type){
    return data.entries.filter(x => x.date.slice(0,7) === key && (!type || x.type === type));
  }
  function sumAmt(list){ return list.reduce((s,x)=>s+Number(x.amount),0); }
  function categorySpend(list){
    const out = {};
    list.forEach(x => { out[x.category] = (out[x.category]||0) + Number(x.amount); });
    return out;
  }

  /* ---------- Tabs ---------- */
  function setTab(tab){
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'tab-'+tab));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('monthNavEl').style.visibility = (tab === 'lend') ? 'hidden' : 'visible';
    if(tab === 'overview') renderOverview();
    if(tab === 'lend') renderLend();
    if(tab === 'history') renderHistory();
    if(tab === 'reports') renderReports();
  }
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

  /* ---------- Add tab ---------- */
  function currentCatList(){ return currentType === 'expense' ? data.expenseCategories : data.incomeCategories; }

  function renderChips(){
    const row = document.getElementById('chipRow');
    row.innerHTML = '';
    currentCatList().forEach(cat => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (cat === selectedCategory ? ' selected '+currentType : '');
      b.textContent = cat;
      b.addEventListener('click', () => { selectedCategory = cat; renderChips(); });
      row.appendChild(b);
    });
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'chip add-chip';
    addBtn.textContent = '+ New';
    addBtn.addEventListener('click', () => {
      document.getElementById('addCatInline').style.display = 'flex';
      document.getElementById('newCatInput').focus();
    });
    row.appendChild(addBtn);
  }

  function setType(type){
    currentType = type;
    selectedCategory = null;
    document.getElementById('toggleExpense').classList.toggle('active', type==='expense');
    document.getElementById('toggleIncome').classList.toggle('active', type==='income');
    const btn = document.getElementById('submitBtn');
    btn.className = 'submit-btn ' + type;
    btn.textContent = type === 'expense' ? 'Add expense' : 'Add income';
    document.getElementById('addCatInline').style.display = 'none';
    renderChips();
  }
  document.getElementById('toggleExpense').addEventListener('click', () => setType('expense'));
  document.getElementById('toggleIncome').addEventListener('click', () => setType('income'));

  document.getElementById('confirmAddCat').addEventListener('click', async () => {
    const inp = document.getElementById('newCatInput');
    const val = inp.value.trim();
    if(!val) return;
    const list = currentCatList();
    if(!list.includes(val)) list.push(val);
    selectedCategory = val;
    inp.value = '';
    document.getElementById('addCatInline').style.display = 'none';
    await saveData();
    renderChips();
  });

  document.getElementById('entryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const amt = Number(document.getElementById('fAmount').value);
    const dateVal = document.getElementById('fDate').value;
    const noteVal = document.getElementById('fNote').value.trim();
    if(!amt || !dateVal || !selectedCategory){
      if(!selectedCategory) showToast('Pick a category first');
      return;
    }
    const id = Date.now();
    data.entries.push({ id, type: currentType, date: dateVal, category: selectedCategory, amount: amt, note: noteVal });
    newRowId = id;
    await saveData();

    const entryMonth = dateVal.slice(0,7);
    if(entryMonth !== monthKey(currentMonth)){
      currentMonth = new Date(dateVal+'T00:00:00'); currentMonth.setDate(1);
      renderMonthLabel();
    }
    showToast((currentType === 'expense' ? 'Expense' : 'Income') + ' of ' + fmt(amt) + ' added');
    document.getElementById('fAmount').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('fDate').value = todayStr();
  });

  /* ---------- Overview tab ---------- */
  function renderDonut(spendMap, categories){
    const wrap = document.getElementById('donutWrap');
    const entries = categories.map(c => [c, spendMap[c]||0]).filter(([,v]) => v > 0).sort((a,b)=>b[1]-a[1]);
    const total = entries.reduce((s,[,v])=>s+v,0);
    if(total === 0){
      wrap.innerHTML = '<div class="empty-note">No expenses logged this month yet.</div>';
      return;
    }
    const r = 50, c = 2*Math.PI*r;
    let offset = 0;
    let circles = '';
    entries.forEach(([cat,val]) => {
      const dash = (val/total)*c;
      circles += `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${catColor(categories,cat)}" stroke-width="16" stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"/>`;
      offset += dash;
    });
    const legend = entries.map(([cat,val]) => `
      <div class="legend-item">
        <span class="legend-dot" style="background:${catColor(categories,cat)}"></span>
        <span>${cat}</span>
        <span class="amt">${fmt(val)}</span>
      </div>`).join('');
    wrap.innerHTML = `
      <div class="donut-svg-wrap">
        <svg viewBox="0 0 120 120" width="120" height="120">${circles}</svg>
        <div class="donut-center"><div class="amt">${fmt(total)}</div><div class="lbl">total</div></div>
      </div>
      <div class="legend">${legend}</div>`;
  }

  function renderCatBreakdown(spendMap){
    const box = document.getElementById('catBreakdown');
    box.innerHTML = '';
    data.expenseCategories.forEach(cat => {
      const spent = spendMap[cat] || 0;
      const budget = Number(data.budgets[cat]) || 0;
      let ratio = budget > 0 ? spent/budget : 0;
      let fillColor = 'var(--ink-soft)';
      let widthPct = budget > 0 ? Math.min(ratio,1)*100 : (spent>0 ? 100 : 0);
      if(budget > 0){
        if(ratio > 1) fillColor = 'var(--brick)';
        else if(ratio >= 0.8) fillColor = 'var(--amber)';
        else fillColor = 'var(--moss)';
      }
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML = `
        <div class="cat-name">${cat}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${widthPct}%; background:${fillColor};"></div></div>
        <div class="cat-figures">
          <span class="spent">${fmt(spent)}</span><span>/ ₹</span>
          <input type="number" class="budget-input" min="0" step="1" value="${budget||''}" placeholder="0" data-cat="${cat}">
        </div>`;
      box.appendChild(row);
    });
    box.querySelectorAll('.budget-input').forEach(inp => {
      inp.addEventListener('change', async (e) => {
        data.budgets[e.target.dataset.cat] = Number(e.target.value) || 0;
        await saveData();
        renderOverview();
      });
    });
  }

  function renderOverview(){
    const key = monthKey(currentMonth);
    const exp = entriesForMonth(key,'expense');
    const inc = entriesForMonth(key,'income');
    const totalExp = sumAmt(exp), totalInc = sumAmt(inc), net = totalInc - totalExp;
    document.getElementById('statIncome').textContent = fmt(totalInc);
    document.getElementById('statExpense').textContent = fmt(totalExp);
    const netEl = document.getElementById('statNet');
    netEl.textContent = (net<0?'−':'') + fmt(net);
    netEl.className = 'value ' + (net<0?'neg':'pos');
    renderDonut(categorySpend(exp), data.expenseCategories);
    renderCatBreakdown(categorySpend(exp));
  }

  /* ---------- History tab ---------- */
  document.querySelectorAll('.filter-chips button').forEach(b => {
    b.addEventListener('click', () => {
      historyFilter = b.dataset.filter;
      document.querySelectorAll('.filter-chips button').forEach(x=>x.classList.toggle('active', x===b));
      renderHistory();
    });
  });

  function renderHistory(){
    const key = monthKey(currentMonth);
    let list = entriesForMonth(key);
    if(historyFilter !== 'all') list = list.filter(x => x.type === historyFilter);
    const box = document.getElementById('txList');
    if(list.length === 0){
      box.innerHTML = '<div class="empty-state">Nothing logged here yet.</div>';
      return;
    }
    const sorted = [...list].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
    box.innerHTML = sorted.map(x => {
      const d = new Date(x.date+'T00:00:00');
      const dateStr = d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
      const sign = x.type === 'income' ? '+' : '−';
      const highlight = x.id === newRowId ? ' style="background:rgba(169,131,91,0.15)"' : '';
      return `<div class="tx-row"${highlight}>
        <div class="tx-date">${dateStr}</div>
        <div class="tx-main"><div class="tx-cat">${x.category}</div>${x.note?`<div class="tx-note">${x.note}</div>`:''}</div>
        <div class="tx-amt ${x.type}">${sign}${fmt(x.amount)}</div>
        <button class="del-btn" data-id="${x.id}">✕</button>
      </div>`;
    }).join('');
    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = Number(e.currentTarget.dataset.id);
        data.entries = data.entries.filter(x => x.id !== id);
        await saveData();
        renderHistory();
      });
    });
    newRowId = null;
  }

  /* ---------- Lend / Borrow tab ---------- */
  function loanRepaid(loan){ return (loan.repayments||[]).reduce((s,r)=>s+Number(r.amount),0); }
  function loanOutstanding(loan){ return Math.max(0, Number(loan.amount) - loanRepaid(loan)); }

  function logEvent(action, loan, opts){
    opts = opts || {};
    data.loanLog.push({
      id: Date.now()+Math.random(),
      action,
      direction: loan.direction,
      kind: loan.kind || 'person',
      person: loan.person,
      amount: opts.amount !== undefined ? opts.amount : loan.amount,
      date: opts.date || loan.date,
      note: opts.note !== undefined ? opts.note : (loan.note||'')
    });
  }

  function checkAndLogClosed(loan){
    const isSettled = loanOutstanding(loan) <= 0;
    if(isSettled && !loan.settledLogged){
      logEvent('closed', loan);
      loan.settledLogged = true;
    } else if(!isSettled && loan.settledLogged){
      loan.settledLogged = false;
    }
  }

  function updateCreditLabels(){
    const l1 = document.getElementById('creditStat1Label');
    const l2 = document.getElementById('creditStat2Label');
    const btn = document.getElementById('submitLoan');
    const toggle = document.getElementById('newLoanToggle');
    if(creditDirection === 'lent'){
      l1.textContent = 'Owed to you';
      l2.textContent = 'Repaid to you';
      btn.textContent = 'Add loan';
      btn.classList.remove('borrowed');
      toggle.classList.remove('is-borrow');
      toggle.textContent = '+ New loan';
    } else {
      l1.textContent = 'You owe';
      l2.textContent = "You've repaid";
      btn.textContent = 'Add entry';
      btn.classList.add('borrowed');
      toggle.classList.add('is-borrow');
      toggle.textContent = '+ New entry';
    }
    document.querySelectorAll('.stat-card.lend').forEach(c => c.classList.toggle('borrow', creditDirection==='borrowed'));
    document.getElementById('kindFieldRow').style.display = creditDirection === 'borrowed' ? '' : 'none';
    updatePersonFieldLabel();
  }

  function updatePersonFieldLabel(){
    const label = document.getElementById('personFieldLabel');
    if(creditDirection === 'lent'){ label.textContent = 'Person'; return; }
    const map = { person:'Person', loan:'Lender / Bank', chit:'Chit group' };
    label.textContent = map[selectedKind] || 'Person';
  }

  document.querySelectorAll('#creditToggle button').forEach(b => {
    b.addEventListener('click', () => {
      creditDirection = b.dataset.dir;
      document.querySelectorAll('#creditToggle button').forEach(x => x.classList.toggle('active', x===b));
      personFilter = null;
      updateCreditLabels();
      renderLend();
    });
  });

  document.querySelectorAll('.kind-chip').forEach(b => {
    b.addEventListener('click', () => {
      selectedKind = b.dataset.kind;
      document.querySelectorAll('.kind-chip').forEach(x => x.classList.toggle('selected', x===b));
      updatePersonFieldLabel();
    });
  });

  document.getElementById('newLoanToggle').addEventListener('click', () => {
    const form = document.getElementById('newLoanForm');
    form.classList.toggle('open');
    if(form.classList.contains('open')){
      document.getElementById('loanDate').value = todayStr();
      populatePersonList();
    }
  });

  document.getElementById('loanInstallToggle').addEventListener('change', (e) => {
    document.getElementById('installmentFields').style.display = e.target.checked ? 'block' : 'none';
  });

  function populatePersonList(){
    const dl = document.getElementById('personList');
    const names = [...new Set(data.loans.filter(l => l.direction===creditDirection).map(l => l.person))];
    dl.innerHTML = names.map(n => `<option value="${n}"></option>`).join('');
  }

  document.getElementById('submitLoan').addEventListener('click', async () => {
    const person = document.getElementById('loanPerson').value.trim();
    const amount = Number(document.getElementById('loanAmount').value);
    const date = document.getElementById('loanDate').value || todayStr();
    const note = document.getElementById('loanNote').value.trim();
    if(!person || !amount){
      showToast(!person ? 'Enter a name first' : 'Enter an amount first');
      return;
    }
    let installments = [];
    if(document.getElementById('loanInstallToggle').checked){
      const count = Math.max(2, Number(document.getElementById('loanInstallCount').value) || 3);
      const freq = document.getElementById('loanInstallFreq').value;
      const base = Math.round((amount/count)*100)/100;
      let allocated = 0;
      for(let i=1; i<=count; i++){
        const instAmt = (i===count) ? Math.round((amount-allocated)*100)/100 : base;
        allocated += instAmt;
        const due = new Date(date+'T00:00:00');
        if(freq === 'weekly') due.setDate(due.getDate() + 7*i);
        else due.setMonth(due.getMonth() + i);
        installments.push({
          id: Date.now()+i, seq:i, total:count, amount: instAmt,
          dueDate: due.getFullYear()+'-'+String(due.getMonth()+1).padStart(2,'0')+'-'+String(due.getDate()).padStart(2,'0'),
          paid:false, paidDate:null
        });
      }
    }
    const id = Date.now();
    const kind = creditDirection === 'borrowed' ? selectedKind : 'person';
    const loan = { id, direction: creditDirection, kind, person, amount, date, note, repayments: [], installments, settledLogged:false };
    data.loans.push(loan);
    logEvent('add', loan);
    await saveData();
    document.getElementById('loanPerson').value = '';
    document.getElementById('loanAmount').value = '';
    document.getElementById('loanNote').value = '';
    document.getElementById('loanInstallToggle').checked = false;
    document.getElementById('installmentFields').style.display = 'none';
    document.getElementById('newLoanForm').classList.remove('open');
    expandedLoanId = id;
    showToast((creditDirection==='lent' ? 'Lent ' : 'Borrowed ') + fmt(amount) + (creditDirection==='lent' ? ' to ' : ' from ') + person);
    renderLend();
  });

  function renderInstallmentRows(loan){
    if(!loan.installments || loan.installments.length === 0) return '';
    const rows = loan.installments.map(inst => {
      const status = inst.paid ? 'paid' : (inst.dueDate < todayStr() ? 'overdue' : 'upcoming');
      const dd = new Date(inst.dueDate+'T00:00:00');
      const label = dd.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
      const badge = status==='paid' ? '<span class="inst-badge paid">Paid</span>'
        : status==='overdue' ? '<span class="inst-badge overdue">Overdue</span>'
        : '<span class="inst-badge upcoming">Upcoming</span>';
      return `<div class="inst-row">
        <div class="inst-main">
          <div class="inst-title">Stage ${inst.seq} of ${inst.total}</div>
          <div class="inst-sub">Due ${label} · ${fmt(inst.amount)}</div>
        </div>
        ${badge}
        ${!inst.paid ? `<button type="button" class="inst-pay-btn" data-loan="${loan.id}" data-inst="${inst.id}">Mark paid</button>` : ''}
      </div>`;
    }).join('');
    return `<div class="inst-list">${rows}</div>`;
  }

  function renderPersonSummary(list){
    const block = document.getElementById('personSummaryBlock');
    const box = document.getElementById('personSummary');
    const people = {};
    list.forEach(l => {
      const out = loanOutstanding(l);
      if(!people[l.person]) people[l.person] = { outstanding:0, count:0, nextDue:null };
      people[l.person].outstanding += out;
      people[l.person].count += 1;
      (l.installments||[]).forEach(inst => {
        if(!inst.paid && (!people[l.person].nextDue || inst.dueDate < people[l.person].nextDue)){
          people[l.person].nextDue = inst.dueDate;
        }
      });
    });
    const names = Object.keys(people);
    if(names.length <= 1){ block.style.display = 'none'; box.innerHTML = ''; return; }
    block.style.display = '';
    const sortedNames = names.sort((a,b) => people[b].outstanding - people[a].outstanding);
    const clearBtn = personFilter ? `<button type="button" class="clear-filter" id="clearPersonFilter">✕ Clear filter (${personFilter})</button>` : '';
    box.innerHTML = clearBtn + sortedNames.map(name => {
      const p = people[name];
      const dueTxt = p.nextDue ? ('Next due ' + new Date(p.nextDue+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'})) : (p.count+' entr'+(p.count===1?'y':'ies'));
      return `<div class="person-row ${personFilter===name?'active-filter':''}" data-person="${name}">
        <div><div class="name">${name}</div><div class="sub">${dueTxt}</div></div>
        <div class="amt">${p.outstanding>0?fmt(p.outstanding):'Settled'}</div>
      </div>`;
    }).join('');
    box.querySelectorAll('.person-row').forEach(row => {
      row.addEventListener('click', () => {
        const name = row.dataset.person;
        personFilter = (personFilter===name) ? null : name;
        renderLend();
      });
    });
    const cf = document.getElementById('clearPersonFilter');
    if(cf) cf.addEventListener('click', (e) => { e.stopPropagation(); personFilter = null; renderLend(); });
  }

  function renderLend(){
    updateCreditLabels();
    const active = data.loans.filter(l => l.direction === creditDirection);
    const totalOut = active.reduce((s,l)=>s+loanOutstanding(l),0);
    const totalRepaid = active.reduce((s,l)=>s+loanRepaid(l),0);
    document.getElementById('statLendOut').textContent = fmt(totalOut);
    document.getElementById('statLendRepaid').textContent = fmt(totalRepaid);

    renderPersonSummary(active);

    let list = active;
    if(personFilter) list = list.filter(l => l.person === personFilter);

    const box = document.getElementById('loansList');
    if(list.length === 0){
      box.innerHTML = `<div class="empty-state">${creditDirection==='lent' ? 'Nothing lent out yet.' : 'Nothing borrowed yet.'} Add an entry above to start tracking it.</div>`;
      renderLoanActivity();
      return;
    }
    const sorted = [...list].sort((a,b) => {
      const aOut = loanOutstanding(a), bOut = loanOutstanding(b);
      if((aOut>0) !== (bOut>0)) return aOut>0 ? -1 : 1;
      return b.date.localeCompare(a.date);
    });
    box.innerHTML = sorted.map(loan => {
      const repaid = loanRepaid(loan);
      const outstanding = loanOutstanding(loan);
      const settled = outstanding <= 0;
      const pct = loan.amount > 0 ? Math.min(100, (repaid/loan.amount)*100) : 0;
      const d = new Date(loan.date+'T00:00:00');
      const dateStr = d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
      const isOpen = loan.id === expandedLoanId;
      const kindTag = loan.kind === 'loan' ? '<span class="kind-tag">Loan</span>' : loan.kind === 'chit' ? '<span class="kind-tag">Chit</span>' : '';
      let clearBy = '';
      if(loan.installments && loan.installments.length){
        const unpaid = loan.installments.filter(i => !i.paid);
        const last = loan.installments[loan.installments.length-1];
        const lastDate = new Date(last.dueDate+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
        clearBy = unpaid.length
          ? `<div class="loan-clearby">${unpaid.length} of ${loan.installments.length} stages left · clears by ${lastDate}</div>`
          : `<div class="loan-clearby">All stages paid</div>`;
      }
      const repayRows = (loan.repayments||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r => {
        const rd = new Date(r.date+'T00:00:00');
        return `<div class="repay-row">
          <span>${rd.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}${r.note?' — '+r.note:''}</span>
          <span><span class="amt">+${fmt(r.amount)}</span> <button class="del-btn" data-loan="${loan.id}" data-repay="${r.id}">✕</button></span>
        </div>`;
      }).join('') || '<div class="repay-row"><span style="color:var(--ink-soft); font-style:italic;">No repayments yet</span></div>';
      const instRows = renderInstallmentRows(loan);

      return `<div class="loan-card ${settled?'settled':''} ${loan.direction==='borrowed'?'borrowed':''}">
        <div class="loan-top" data-toggle="${loan.id}">
          <div>
            <div class="loan-person">${loan.person}${kindTag}</div>
            <div class="loan-date">${dateStr}${loan.note?' · '+loan.note:''}</div>
            ${clearBy}
          </div>
          <div class="loan-outstanding">
            ${settled ? '<div class="settled-tag">Settled</div>' : `<div class="amt">${fmt(outstanding)}</div><div class="lbl">${creditDirection==='lent'?'owed':'you owe'}</div>`}
          </div>
        </div>
        <div class="loan-bar"><div class="loan-bar-fill" style="width:${pct}%"></div></div>
        <div class="loan-detail ${isOpen?'open':''}" id="loan-detail-${loan.id}">
          <div style="font-size:11px; color:var(--ink-soft); margin-bottom:6px;">${creditDirection==='lent'?'Lent':'Borrowed'} ${fmt(loan.amount)} · Repaid ${fmt(repaid)}</div>
          ${instRows}
          ${repayRows}
          ${!settled ? `
          <div class="repay-form">
            <input type="number" min="0" step="0.01" placeholder="₹0" id="repayAmt-${loan.id}">
            <input type="date" id="repayDate-${loan.id}" value="${todayStr()}">
            <button type="button" data-repay-loan="${loan.id}">Add</button>
          </div>` : ''}
          <button class="loan-delete-btn" data-delete-loan="${loan.id}">Delete this entry</button>
        </div>
      </div>`;
    }).join('');

    box.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => {
        const id = Number(el.dataset.toggle);
        expandedLoanId = (expandedLoanId === id) ? null : id;
        renderLend();
      });
    });
    box.querySelectorAll('[data-repay-loan]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const loanId = Number(e.currentTarget.dataset.repayLoan);
        const amtInput = document.getElementById('repayAmt-'+loanId);
        const dateInput = document.getElementById('repayDate-'+loanId);
        const amt = Number(amtInput.value);
        if(!amt) { showToast('Enter a repayment amount'); return; }
        const loan = data.loans.find(l => l.id === loanId);
        if(!loan) return;
        loan.repayments = loan.repayments || [];
        const repayDate = dateInput.value || todayStr();
        loan.repayments.push({ id: Date.now(), amount: amt, date: repayDate, instId: null });
        logEvent('repay', loan, { amount: amt, date: repayDate });
        checkAndLogClosed(loan);
        await saveData();
        showToast('Repayment of ' + fmt(amt) + ' logged');
        renderLend();
      });
    });
    box.querySelectorAll('.inst-pay-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const loanId = Number(e.currentTarget.dataset.loan);
        const instId = Number(e.currentTarget.dataset.inst);
        const loan = data.loans.find(l => l.id === loanId);
        if(!loan) return;
        const inst = (loan.installments||[]).find(i => i.id === instId);
        if(!inst) return;
        inst.paid = true;
        inst.paidDate = todayStr();
        loan.repayments = loan.repayments || [];
        loan.repayments.push({ id: Date.now(), amount: inst.amount, date: todayStr(), note: `Stage ${inst.seq} of ${inst.total}`, instId: inst.id });
        logEvent('repay', loan, { amount: inst.amount, date: todayStr(), note: `Stage ${inst.seq} of ${inst.total}` });
        checkAndLogClosed(loan);
        await saveData();
        showToast('Stage ' + inst.seq + ' marked paid');
        renderLend();
      });
    });
    box.querySelectorAll('.repay-row .del-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const loanId = Number(e.currentTarget.dataset.loan);
        const repayId = Number(e.currentTarget.dataset.repay);
        const loan = data.loans.find(l => l.id === loanId);
        if(!loan) return;
        const removed = (loan.repayments||[]).find(r => r.id === repayId);
        loan.repayments = (loan.repayments||[]).filter(r => r.id !== repayId);
        if(removed && removed.instId){
          const inst = (loan.installments||[]).find(i => i.id === removed.instId);
          if(inst){ inst.paid = false; inst.paidDate = null; }
        }
        checkAndLogClosed(loan);
        await saveData();
        renderLend();
      });
    });
    box.querySelectorAll('[data-delete-loan]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const loanId = Number(e.currentTarget.dataset.deleteLoan);
        const loan = data.loans.find(l => l.id === loanId);
        if(loan) logEvent('delete', loan, { amount: loan.amount });
        data.loans = data.loans.filter(l => l.id !== loanId);
        await saveData();
        expandedLoanId = null;
        renderLend();
      });
    });
    renderLoanActivity();
  }

  function renderLoanActivity(){
    const box = document.getElementById('loanActivity');
    if(!box) return;
    let events = data.loanLog.filter(ev => ev.direction === creditDirection);
    if(personFilter) events = events.filter(ev => ev.person === personFilter);
    if(events.length === 0){ box.innerHTML = '<div class="empty-state">No history yet.</div>'; return; }
    const sorted = [...events].sort((a,b) => b.date.localeCompare(a.date) || (b.id - a.id));
    box.innerHTML = sorted.slice(0,40).map(ev => {
      const d = new Date(ev.date+'T00:00:00');
      const label = d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
      let text, cls;
      if(ev.action === 'add'){
        text = (ev.direction==='lent' ? `Lent ${fmt(ev.amount)} to ${ev.person}` : `Borrowed ${fmt(ev.amount)} from ${ev.person}`) + (ev.note?' — '+ev.note:'');
        cls = 'lend';
      } else if(ev.action === 'repay'){
        text = (ev.direction==='lent' ? `${ev.person} repaid ${fmt(ev.amount)}` : `You repaid ${fmt(ev.amount)} to ${ev.person}`) + (ev.note?' ('+ev.note+')':'');
        cls = 'repay';
      } else if(ev.action === 'closed'){
        text = `${ev.person} — fully settled`;
        cls = 'closed';
      } else if(ev.action === 'delete'){
        text = `Entry for ${ev.person} (${fmt(ev.amount)}) deleted`;
        cls = 'deleted';
      }
      return `<div class="activity-row"><span class="activity-date">${label}</span><span class="activity-text ${cls}">${text}</span></div>`;
    }).join('');
  }


  /* ---------- Reports tab ---------- */
  function renderTrendChart(){
    const months = [];
    for(let i=5; i>=0; i--){
      const d = new Date(currentMonth); d.setMonth(d.getMonth()-i);
      months.push(d);
    }
    const totals = months.map(d => {
      const key = monthKey(d);
      return { label: shortMonthLabel(d), inc: sumAmt(entriesForMonth(key,'income')), exp: sumAmt(entriesForMonth(key,'expense')) };
    });
    const max = Math.max(1, ...totals.map(t => Math.max(t.inc,t.exp)));
    const w = 300, h = 130, groupW = w/months.length, barW = 14, baseline = h-18;
    let bars = '';
    totals.forEach((t,i) => {
      const gx = i*groupW + groupW/2;
      const incH = (t.inc/max)*(baseline-8);
      const expH = (t.exp/max)*(baseline-8);
      bars += `<rect x="${gx-barW-2}" y="${baseline-incH}" width="${barW}" height="${incH}" fill="var(--moss)" rx="2"/>`;
      bars += `<rect x="${gx+2}" y="${baseline-expH}" width="${barW}" height="${expH}" fill="var(--brick)" rx="2"/>`;
      bars += `<text x="${gx}" y="${h-4}" font-size="9" fill="var(--ink-soft)" text-anchor="middle" font-family="Inter">${t.label}</text>`;
    });
    document.getElementById('trendChart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="130"><line x1="0" y1="${baseline}" x2="${w}" y2="${baseline}" stroke="var(--rule)" stroke-width="1"/>${bars}</svg>`;
  }

  function renderSummaryReport(){
    const key = monthKey(currentMonth);
    const exp = entriesForMonth(key,'expense'), inc = entriesForMonth(key,'income');
    const totalExp = sumAmt(exp), totalInc = sumAmt(inc), net = totalInc-totalExp;
    const rate = totalInc>0 ? (net/totalInc*100) : null;
    document.getElementById('summaryCard').innerHTML = `
      <div class="report-row"><span>Income</span><span class="val pos">${fmt(totalInc)}</span></div>
      <div class="report-row"><span>Expenses</span><span class="val neg">${fmt(totalExp)}</span></div>
      <div class="report-row total"><span>Net savings</span><span class="val ${net<0?'neg':'pos'}">${net<0?'−':''}${fmt(net)}</span></div>
      <div class="report-row"><span>Savings rate</span><span class="val">${rate===null?'—':Math.round(rate)+'%'}</span></div>`;

    const top = document.getElementById('topCats');
    const spendMap = categorySpend(exp);
    const sorted = Object.entries(spendMap).sort((a,b)=>b[1]-a[1]).slice(0,3);
    top.innerHTML = sorted.length ? sorted.map(([c,v]) => `<li><span>${c}</span><span class="amt">${fmt(v)}</span></li>`).join('') : '<li><span>No expenses logged yet this month</span></li>';
  }

  function renderReportInsights(){
    const key = monthKey(currentMonth);
    const exp = entriesForMonth(key,'expense'), inc = entriesForMonth(key,'income');
    const spendMap = categorySpend(exp);
    const totalExp = sumAmt(exp), totalInc = sumAmt(inc);
    const totalBudget = data.expenseCategories.reduce((s,c)=>s+(Number(data.budgets[c])||0),0);
    const items = [];

    data.expenseCategories.forEach(cat => {
      const spent = spendMap[cat]||0;
      const budget = Number(data.budgets[cat])||0;
      if(budget > 0){
        if(spent > budget) items.push({level:'alert', text:`${cat} is ${fmt(spent-budget)} over its ${fmt(budget)} budget — trim it before the month closes.`});
        else if(spent/budget >= 0.8) items.push({level:'warn', text:`${cat} is at ${Math.round(spent/budget*100)}% of budget — ${fmt(budget-spent)} left.`});
      } else if(spent > 0){
        items.push({level:'note', text:`${cat} has ${fmt(spent)} logged with no budget set — cap it to keep it in view.`});
      }
    });
    if(totalBudget>0 && totalExp>totalBudget){
      items.unshift({level:'alert', text:`Overall spend is ${fmt(totalExp-totalBudget)} past your total budget this month.`});
    }
    if(totalInc === 0 && totalExp > 0){
      items.push({level:'note', text:`No income logged this month — add it to see your real savings rate.`});
    } else if(totalInc > 0){
      const net = totalInc - totalExp;
      const rate = net/totalInc*100;
      if(net < 0) items.push({level:'alert', text:`Spending exceeded income by ${fmt(Math.abs(net))} this month.`});
      else if(rate < 20) items.push({level:'note', text:`Savings rate is ${Math.round(rate)}% this month — many budgeting guides suggest aiming for at least 20%.`});
      else items.push({level:'good', text:`Saving ${Math.round(rate)}% of income this month — solidly on track.`});
    }
    const prev = new Date(currentMonth); prev.setMonth(prev.getMonth()-1);
    const prevExp = sumAmt(entriesForMonth(monthKey(prev),'expense'));
    if(prevExp > 0){
      const diff = ((totalExp-prevExp)/prevExp)*100;
      if(diff > 10) items.push({level:'warn', text:`Spending is up ${Math.round(diff)}% versus last month.`});
      else if(diff < -10) items.push({level:'good', text:`Spending is down ${Math.round(Math.abs(diff))}% versus last month — keep that up.`});
    }
    const isCurrentMonth = monthKey(currentMonth) === monthKey(new Date());
    if(isCurrentMonth){
      const monthEntries = entriesForMonth(key);
      if(monthEntries.length){
        const lastDate = monthEntries.reduce((a,b)=> a.date>b.date?a:b).date;
        const daysSince = Math.floor((new Date(todayStr())-new Date(lastDate))/86400000);
        if(daysSince >= 3) items.push({level:'warn', text:`No entries logged in ${daysSince} days — log today's activity to stay on track.`});
      } else {
        items.push({level:'note', text:`Nothing logged yet this month — add today's income and expenses to get started.`});
      }
    }
    const order = {alert:0,warn:1,note:2,good:3};
    items.sort((a,b)=>order[a.level]-order[b.level]);
    document.getElementById('insightsBox').innerHTML = items.map(i =>
      `<div class="insight-item ${i.level}"><span class="mark">●</span><span>${i.text}</span></div>`
    ).join('') || `<div class="insight-item good"><span class="mark">●</span><span>All clear — nothing needs attention right now.</span></div>`;
  }

  function renderReports(){
    renderSummaryReport();
    renderTrendChart();
    renderReportInsights();
  }

  document.getElementById('printBtn').addEventListener('click', () => window.print());

  /* ---------- Month nav ---------- */
  function renderMonthLabel(){ document.getElementById('monthLabel').textContent = monthLabel(currentMonth); }
  function refreshActiveTab(){
    const activeId = document.querySelector('.screen.active').id;
    if(activeId === 'tab-overview') renderOverview();
    if(activeId === 'tab-history') renderHistory();
    if(activeId === 'tab-reports') renderReports();
  }
  document.getElementById('prevMonth').addEventListener('click', () => { currentMonth.setMonth(currentMonth.getMonth()-1); renderMonthLabel(); refreshActiveTab(); });
  document.getElementById('nextMonth').addEventListener('click', () => { currentMonth.setMonth(currentMonth.getMonth()+1); renderMonthLabel(); refreshActiveTab(); });

  /* ---------- Init ---------- */
  (async function init(){
    document.getElementById('fDate').value = todayStr();
    await loadData();
    renderMonthLabel();
    setType('expense');
    renderOverview();
  })();
})();
</script>
</body>
</html>
